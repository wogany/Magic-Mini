<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Magic-Mini 调光控制</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Arial", "华文细黑";
            }

            body {
                min-height: 100dvh;
                max-width: 100vw;
                padding: 20px;
            }

            .container {
                margin: 0 auto;
                width: 100%;
                padding: 20px;
                max-width: 450px;
            }

            h1 {
                text-align: center;
                color: rgb(0, 123, 255);
                margin: 10px 0 20px 0;
                font-size: 24px;
            }

            .color-wheel-container {
                position: relative;
                width: 100%;
                padding-top: 100%;
                margin-bottom: 30px;
            }

            #colorWheel {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
            }

            #colorSelector {
                position: absolute;
                width: 20px;
                height: 20px;
                border: 2px solid white;
                border-radius: 50%;
                box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
                transform: translate(-50%, -50%);
                cursor: grab;
                user-select: none;
            }

            #colorSelector:active {
                cursor: grabbing;
            }

            .current-color {
                width: 100%;
                height: 60px;
                border-radius: 8px;
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 16px;
                font-weight: bold;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            }

            .controls {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            button {
                border: none;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                padding: 12px;
                font-size: 14px;
            }

            #setColorBtn {
                background-color: rgb(0, 123, 255);
                color: white;
            }

            #dialog {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 150px;
                height: 150px;
                border: none;
                outline: none;
                border-radius: 12px;
                background-color: rgba(0, 0, 0, 0.3);
                color: white;
            }

            #dialogMessage {
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                line-height: 150px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Magic-Mini 调光控制</h1>

            <div class="color-wheel-container">
                <canvas id="colorWheel"></canvas>
                <div id="colorSelector"></div>
            </div>

            <div class="current-color" id="currentColor">RGB(0, 0, 0)</div>

            <div class="controls">
                <button id="setColorBtn">应用颜色</button>
            </div>
        </div>
        <dialog id="dialog">
            <p id="dialogMessage">message</p>
        </dialog>
        <script>
            // 全局变量定义
            let canvas, ctx; // Canvas元素和绘图上下文
            let colorWheel, colorSelector, currentColor; // DOM元素引用
            let setColorBtn; // DOM元素引用
            let isDragging = false; // 标记是否正在拖动选择器
            let centerX, centerY, radius; // 色盘中心点坐标和半径
            let deviceAddress = "localhost"; // 设备的mDNS地址
            let isConnected = false; // 标记是否已连接到设备
            let dialog, dialogMessage;

            // 初始化函数，页面加载后执行
            function init() {
                // 获取DOM元素引用
                colorWheel = document.getElementById("colorWheel");
                colorSelector = document.getElementById("colorSelector");
                currentColor = document.getElementById("currentColor");
                setColorBtn = document.getElementById("setColorBtn");
                dialog = document.getElementById("dialog");
                dialogMessage = document.getElementById("dialogMessage");

                // 设置Canvas绘图上下文
                canvas = colorWheel;
                ctx = canvas.getContext("2d");

                // 重新绘制Canvas以适应容器
                redrawCanvas();
                window.addEventListener("resize", redrawCanvas); // 监听窗口大小变化事件

                // 设置鼠标和触摸事件监听
                colorWheel.addEventListener("mousedown", startDrag);
                colorWheel.addEventListener("touchstart", startDrag, { passive: true });
                document.addEventListener("mousemove", drag);
                document.addEventListener("touchmove", drag, { passive: false });
                document.addEventListener("mouseup", endDrag);
                document.addEventListener("touchend", endDrag);

                // 为按钮添加点击事件监听
                setColorBtn.addEventListener("click", setColor);
                getColor();
            }

            // 重绘Canvas
            function redrawCanvas() {
                const container = colorWheel.parentElement;
                const size = container.clientWidth;
                canvas.width = size;
                canvas.height = size;

                centerX = size / 2; // 计算色盘中心点X坐标
                centerY = size / 2; // 计算色盘中心点Y坐标
                radius = size / 2 - 5; // 计算色盘半径，留出一些边距

                // 重绘色盘以适应新大小
                drawColorWheel();
            }

            // 绘制色盘
            function drawColorWheel() {
                const gradient = ctx.createConicGradient(0, centerX, centerY); // 创建圆锥渐变

                // 添加颜色渐变，形成完整的色相环
                gradient.addColorStop(0, "#ff0000"); // 红
                gradient.addColorStop(1 / 6, "#ffff00"); // 黄
                gradient.addColorStop(2 / 6, "#00ff00"); // 绿
                gradient.addColorStop(3 / 6, "#00ffff"); // 青
                gradient.addColorStop(4 / 6, "#0000ff"); // 蓝
                gradient.addColorStop(5 / 6, "#ff00ff"); // 紫
                gradient.addColorStop(1, "#ff0000"); // 红

                // 绘制圆形色盘
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = gradient;
                ctx.fill();

                // 绘制中心白色区域，形成饱和度控制
                const innerRadius = radius * 0.8;
                const innerGradient = ctx.createRadialGradient(
                    centerX,
                    centerY,
                    0,
                    centerX,
                    centerY,
                    innerRadius
                );
                innerGradient.addColorStop(0, "#ffffff");
                innerGradient.addColorStop(1, "rgba(255, 255, 255, 0)");

                ctx.beginPath();
                ctx.arc(centerX, centerY, innerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = innerGradient;
                ctx.fill();
            }

            // 开始拖动选择器
            function startDrag(e) {
                e.preventDefault(); // 阻止默认行为
                isDragging = true; // 设置拖动状态为开始
                moveSelector(e); // 移动选择器到点击位置
            }

            // 拖动选择器
            function drag(e) {
                if (isDragging) {
                    // 只有在拖动状态下才响应移动事件
                    e.preventDefault(); // 阻止默认行为
                    moveSelector(e); // 移动选择器
                }
            }

            // 结束拖动
            function endDrag() {
                isDragging = false; // 设置拖动状态为结束
            }

            // 移动选择器到指定位置
            function moveSelector(e) {
                let clientX, clientY;

                // 处理鼠标和触摸事件
                if (e.type.includes("mouse")) {
                    clientX = e.clientX;
                    clientY = e.clientY;
                } else {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                // 获取Canvas在页面中的位置，计算相对坐标
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                // 计算与中心的距离
                const dx = x - centerX;
                const dy = y - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 限制在色盘范围内，考虑选择器大小
                let constrainedX = x;
                let constrainedY = y;

                // 选择器半径（选择器是20px×20px，所以半径是10px）
                const selectorRadius = 10;

                if (distance > radius - selectorRadius) {
                    // 超出范围，计算边界上的点，考虑选择器大小
                    const ratio = (radius - selectorRadius) / distance;
                    constrainedX = centerX + dx * ratio;
                    constrainedY = centerY + dy * ratio;
                }

                // 移动选择器到计算位置
                colorSelector.style.left = `${constrainedX}px`;
                colorSelector.style.top = `${constrainedY}px`;

                // 更新当前颜色显示
                updateCurrentColor(constrainedX, constrainedY);
            }

            // 获取当前颜色
            function updateCurrentColor(x, y) {
                // 使用Canvas的getImageData方法直接获取像素颜色
                const imageData = ctx.getImageData(x, y, 1, 1);
                const pixel = imageData.data;

                // 获取RGB值
                let r = pixel[0];
                let g = pixel[1];
                let b = pixel[2];

                // 特殊处理中心白色区域的颜色
                // 当颜色非常接近白色时，可能是因为透明度混合导致的
                const threshold = 240; // 阈值
                if (r > threshold && g > threshold && b > threshold) {
                    // 检查是否在中心白色区域内
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const innerRadius = radius * 0.8;

                    // 如果在中心白色区域内，使用更准确的颜色计算
                    if (distance < innerRadius) {
                        // 计算该位置理论上应该是的颜色
                        // 中心是白色，向外逐渐变为色环颜色
                        const ratio = distance / innerRadius;
                        if (ratio < 0.3) {
                            // 非常接近中心，应该是白色
                            r = 255;
                            g = 255;
                            b = 255;
                        } else {
                            // 保持原来的颜色，但确保是有效的RGB值
                            r = Math.min(255, Math.max(0, r));
                            g = Math.min(255, Math.max(0, g));
                            b = Math.min(255, Math.max(0, b));
                        }
                    }
                }

                // 设置当前颜色显示
                currentColor.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                currentColor.textContent = `RGB(${r}, ${g}, ${b})`;
                return { r, g, b };
            }

            // 通过Canvas搜索找到最接近目标颜色的像素点
            function findClosestColorPosition(targetR, targetG, targetB) {
                // 在色轮上搜索最接近目标颜色的像素点
                const searchRadius = radius;
                let bestMatch = null;
                let minDifference = Infinity;

                // 搜索步长，较小的值更精确但更慢
                const step = 10;

                // 在色轮范围内搜索
                for (let x = centerX - searchRadius; x <= centerX + searchRadius; x += step) {
                    for (let y = centerY - searchRadius; y <= centerY + searchRadius; y += step) {
                        // 检查点是否在色轮内
                        const dx = x - centerX;
                        const dy = y - centerY;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance <= searchRadius) {
                            // 获取该点的颜色
                            const imageData = ctx.getImageData(x, y, 1, 1);
                            const pixel = imageData.data;
                            const r = pixel[0];
                            const g = pixel[1];
                            const b = pixel[2];

                            // 计算颜色差异（使用欧几里得距离）
                            const diff = Math.sqrt(
                                Math.pow(r - targetR, 2) +
                                    Math.pow(g - targetG, 2) +
                                    Math.pow(b - targetB, 2)
                            );

                            // 如果这是最接近的颜色，保存位置
                            if (diff < minDifference) {
                                minDifference = diff;
                                bestMatch = { x, y, r, g, b, diff };
                            }
                        }
                    }
                }

                return bestMatch;
            }

            // 改进的设置选择器位置函数，使用颜色搜索
            function setSelectorPositionByColor(r, g, b) {
                const closest = findClosestColorPosition(r, g, b);
                if (closest) {
                    x = closest.x;
                    y = closest.y;
                    console.log(
                        `找到更接近的颜色位置: x=${x.toFixed(2)}, y=${y.toFixed(
                            2
                        )}, 差异=${closest.diff.toFixed(2)}`
                    );
                }

                // 设置选择器位置
                colorSelector.style.left = `${x}px`;
                colorSelector.style.top = `${y}px`;

                // 更新当前颜色显示
                updateCurrentColor(x, y);
            }

            // 设置颜色到设备
            async function setColor() {
                dialogMessage.textContent = "改变颜色中...";
                dialog.showModal(); // 显示弹窗

                // 获取选择器位置
                const x = parseFloat(colorSelector.style.left);
                const y = parseFloat(colorSelector.style.top);

                // 使用updateCurrentColor函数获取颜色并解构
                const { r, g, b } = updateCurrentColor(x, y);

                try {
                    // 发送颜色到设备，使用URL参数而不是JSON
                    const response = await fetch(
                        `http://${deviceAddress}/set-color?r=${r}&g=${g}&b=${b}`,
                        {
                            method: "POST",
                        }
                    );

                    if (response.ok) {
                        dialogMessage.textContent = `设置成功`;
                    } else {
                        throw new Error("设置颜色失败");
                    }
                } catch (error) {
                    dialog.close(); // 关闭弹窗
                    dialogMessage.textContent = error.message;
                    dialog.showModal(); // 显示弹窗
                } finally {
                    setTimeout(() => {
                        dialog.close(); // 1秒后关闭弹窗
                    }, 1000);
                }
            }

            async function getColor() {
                dialogMessage.textContent = "获取颜色中...";
                dialog.showModal(); // 显示弹窗

                try {
                    // 获取设备颜色，使用URL参数而不是JSON
                    const response = await fetch(`http://${deviceAddress}/current-color`, {});

                    if (response.ok) {
                        dialogMessage.textContent = `获取成功`;
                        const text = await response.text();
                        // 解析文本格式 "r,g,b"
                        const colorValues = text.split(",");
                        const r = parseInt(colorValues[0]);
                        const g = parseInt(colorValues[1]);
                        const b = parseInt(colorValues[2]);

                        // 更新当前颜色显示
                        updateCurrentColor(r, g, b);
                        setSelectorPositionByColor(r, g, b);
                    } else {
                        throw new Error("获取颜色失败");
                    }
                } catch (error) {
                    dialog.close(); // 关闭弹窗
                    dialogMessage.textContent = error.message;
                    dialog.showModal(); // 显示弹窗
                    setTimeout(() => {
                        dialog.close(); // 1秒后关闭弹窗
                    }, 1000);
                } finally {
                    dialog.close(); // 无论是否成功，都关闭弹窗
                }
            }
            // 页面加载完成后初始化
            window.addEventListener("load", init);
        </script>
    </body>
</html>
